name: x86-64-assembly / main

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            compiler: gcc
          - os: ubuntu-26.04
            compiler: clang
          - os: macos-15
            compiler: clang

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install project dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y nasm

      - name: Install project dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          export NASM_VERSION=3.01
          curl -O https://www.nasm.us/pub/nasm/releasebuilds/${NASM_VERSION}/macosx/nasm-${NASM_VERSION}-macosx.zip
          unzip nasm-${NASM_VERSION}-macosx.zip
          echo $(pwd)/nasm-${NASM_VERSION} >> $GITHUB_PATH

      - name: Run exercism/x86-64-assembly ci (runs tests) for all exercises
        env:
          CC: ${{ matrix.compiler }}
          CC_FOR_BUILD: ${{ matrix.compiler }}
        run: bin/verify-exercises -j "$(getconf _NPROCESSORS_ONLN)"

  tests:
    name: Tests
    needs: ci
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check that every configuration passed
        env:
          RESULT: ${{ needs.ci.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "The exercise tests failed on at least one configuration."
            exit 1
          fi
